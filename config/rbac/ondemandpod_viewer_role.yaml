# This rule is not used by the project on-demand-pod itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ondemand.olian04.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: on-demand-pod
    app.kubernetes.io/managed-by: kustomize
  name: ondemandpod-viewer-role
rules:
- apiGroups:
  - ondemand.olian04.github.io
  resources:
  - ondemandpods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ondemand.olian04.github.io
  resources:
  - ondemandpods/status
  verbs:
  - get
