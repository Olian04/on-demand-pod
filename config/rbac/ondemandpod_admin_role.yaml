# This rule is not used by the project on-demand-pod itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ondemand.olian04.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: on-demand-pod
    app.kubernetes.io/managed-by: kustomize
  name: ondemandpod-admin-role
rules:
- apiGroups:
  - ondemand.olian04.github.io
  resources:
  - ondemandpods
  verbs:
  - '*'
- apiGroups:
  - ondemand.olian04.github.io
  resources:
  - ondemandpods/status
  verbs:
  - get
