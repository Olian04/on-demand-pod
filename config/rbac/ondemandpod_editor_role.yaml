# This rule is not used by the project on-demand-pod itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ondemand.olian04.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: on-demand-pod
    app.kubernetes.io/managed-by: kustomize
  name: ondemandpod-editor-role
rules:
- apiGroups:
  - ondemand.olian04.github.io
  resources:
  - ondemandpods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ondemand.olian04.github.io
  resources:
  - ondemandpods/status
  verbs:
  - get
