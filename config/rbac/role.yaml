---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - ondemand.olian04.github.io
  resources:
  - ondemandpods
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ondemand.olian04.github.io
  resources:
  - ondemandpods/status
  verbs:
  - get
  - patch
  - update
