# Deploys the operator: CRD, RBAC, the manager Deployment and the metrics
# Service. Optional integrations (cert-manager, Prometheus Operator, network
# policies) are deliberately absent; add them in your own overlay.
namespace: on-demand-pod-system
namePrefix: on-demand-pod-

resources:
- ../crd
- ../rbac
- ../manager
- metrics_service.yaml
